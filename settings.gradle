pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://repo1.maven.org/maven2/' }
    }
}

rootProject.name = 'skillcraft-monorepo'

include 'enchantment-shrine'
include 'enchantment-shrine-neoforge'
include 'skillcraft-core'
include 'skillcraft-core-neoforge'
include 'special-forces'
include 'special-forces-neoforge'
include 'village-extras'
include 'village-extras-neoforge'
